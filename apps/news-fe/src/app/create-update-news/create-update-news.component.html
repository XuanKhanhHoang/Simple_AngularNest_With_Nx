<form [formGroup]="myForm" class="p-3" (ngSubmit)="handleSubmit()">
  <div class="mb-4">
    <label for="title" class="block text-sm font-medium text-gray-700"
      >Tiêu đề</label
    >
    <input
      type="text"
      id="title"
      formControlName="title"
      class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
    />
  </div>

  <div class="mb-4">
    <label for="author" class="block text-sm font-medium text-gray-700"
      >Tác giả</label
    >
    <select
      id="author"
      formControlName="author_id"
      class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
    >
      <option *ngFor="let author of authors" [ngValue]="author.id">
        {{ author.name }}
      </option>
    </select>
  </div>

  <div class="mb-4">
    <label for="category" class="block text-sm font-medium text-gray-700"
      >Thể loại</label
    >
    <ng-select
      [items]="categories"
      bindLabel="name"
      bindValue="id"
      [multiple]="true"
      formControlName="category_ids"
    >
    </ng-select>
  </div>
  <quill-editor formControlName="editor"></quill-editor>

  <button
    type="submit"
    class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-9 mx-auto py-2.5 block mt-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"
  >
    {{ isLoading ? 'Loading...' : isEditMode ? 'Cập nhật' : 'Thêm mới' }}
  </button>
</form>
